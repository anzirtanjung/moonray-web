<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
    <title>Moonray — All-in-One AI Video Generator</title>
    <meta name="description" content="Generate AI videos with Motion Control, Image-to-Video, and 20+ AI models">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #FAFAFA;
            --bg-secondary: #F1F5F9;
            --bg-card: #FFFFFF;
            --accent: #6366F1;
            --accent-gradient: linear-gradient(135deg, #6366F1 0%, #8B5CF6 100%);
        }
        
        body {
            font-family: 'Inter', sans-serif;
            margin: 0;
            background-color: var(--bg-primary);
            color: #1E293B;
            overflow-x: hidden;
        }

        /* Kunci utama bypass: Sembunyikan login, siapkan app */
        .login-screen { 
            display: none !important; 
        }

        .app { 
            display: none; /* Akan dibuka paksa oleh app.js */
            opacity: 0;
            transition: opacity 0.5s ease;
        }

        .app.visible {
            display: block !important;
            opacity: 1;
        }

        .loading-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: white;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }

        .hidden { display: none !important; }
    </style>
</head>

<body>
    <!-- Overlay loading sebentar agar transisi halus -->
    <div id="loadingOverlay" class="loading-overlay">
        <div style="text-align:center;">
            <h2 style="color:var(--accent);">Moonray AI</h2>
            <p>Menyiapkan Generator...</p>
        </div>
    </div>

    <!-- Container Utama Aplikasi -->
    <div class="app" id="mainApp">
        <!-- Header -->
        <header style="padding: 15px 20px; background: white; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items:center;">
            <div style="display:flex; align-items:center; gap:10px;">
                <img src="logo.png" alt="Moonray" style="height:32px;" onerror="this.src='https://via.placeholder.com/32x32?text=M'">
                <span style="font-weight:700; font-size:1.2rem; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MOONRAY</span>
            </div>
        </header>

        <!-- Area Konten Utama (Tempat init() bekerja) -->
        <main id="appContent" style="max-width: 1200px; margin: 0 auto; padding: 20px;">
            <!-- Jika file app.js Bapak punya sistem render otomatis, dia akan mengisi di sini -->
            <div id="generator-root"></div>
        </main>
    </div>

    <!-- Script utama -->
    <script>
        // Fungsi tambahan untuk memastikan loading overlay hilang
        window.addEventListener('load', function() {
            setTimeout(() => {
                const overlay = document.getElementById('loadingOverlay');
                if(overlay) overlay.style.display = 'none';
            }, 2000);
        });
    </script>
    <script src="app.js"></script>
</body>
</html>
